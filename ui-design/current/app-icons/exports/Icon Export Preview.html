<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayZ · 图标导出预览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2C2823; --muted:#9C958A; --hair:#E7DFD2; --accent:#786CAD; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ background:#EFEAE0; color:var(--ink); font-family:"Hanken Grotesk",sans-serif;
    padding:48px 40px 80px; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:980px; margin:0 auto; }
  h1{ font-family:Newsreader,serif; font-weight:600; font-size:30px; margin:0 0 4px; }
  .sub{ color:#6A6359; font-family:Newsreader,serif; font-size:15px; margin:0 0 40px; }
  .accent-dot{ display:inline-block; width:11px; height:11px; border-radius:50%;
    background:var(--accent); vertical-align:middle; margin:0 6px; }
  section{ margin-bottom:46px; }
  .label{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
    margin:0 0 18px; font-weight:600; }
  .row{ display:flex; gap:30px; align-items:flex-end; flex-wrap:wrap; }
  .item{ display:flex; flex-direction:column; align-items:center; gap:9px; }
  .cap{ font-size:11px; color:var(--muted); }
  /* iOS squircle mask */
  .ios{ overflow:hidden; box-shadow:0 6px 18px rgba(60,50,35,.18), 0 1px 3px rgba(60,50,35,.12); }
  /* Android circle mask */
  .android{ border-radius:50%; overflow:hidden; box-shadow:0 6px 18px rgba(60,50,35,.18); }
  .stage{ padding:34px 30px; border-radius:18px; }
  .stage.light{ background:#F4EFE6; border:1px solid var(--hair); }
  .stage.dark{ background:linear-gradient(165deg,#2B2740,#3A3052 55%,#4A3F4A); }
  .stage.dark .cap{ color:rgba(255,255,255,.6); }
  img{ display:block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>DayZ · 图标导出</h1>
  <p class="sub">B · 暖纸底<span class="accent-dot"></span>雾紫 Lavender · #786CAD</p>

  <section>
    <p class="label">iOS · 系统圆角遮罩下</p>
    <div class="stage light">
      <div class="row">
        <div class="item"><div class="ios" style="border-radius:40px"><img src="ios/AppIcon.appiconset/icon-1024.png" width="180" height="180"></div><span class="cap">180 · 主屏</span></div>
        <div class="item"><div class="ios" style="border-radius:27px"><img src="ios/AppIcon.appiconset/icon-1024.png" width="120" height="120"></div><span class="cap">120</span></div>
        <div class="item"><div class="ios" style="border-radius:19px"><img src="ios/AppIcon.appiconset/icon-1024.png" width="87" height="87"></div><span class="cap">87 · 设置</span></div>
        <div class="item"><div class="ios" style="border-radius:13px"><img src="ios/AppIcon.appiconset/icon-1024.png" width="58" height="58"></div><span class="cap">58</span></div>
        <div class="item"><div class="ios" style="border-radius:9px"><img src="ios/AppIcon.appiconset/icon-1024.png" width="40" height="40"></div><span class="cap">40 · 通知</span></div>
      </div>
    </div>
  </section>

  <section>
    <p class="label">Android · 自适应（圆形遮罩，前景 + 背景合成）</p>
    <div class="stage light">
      <div class="row">
        <div class="item"><div class="android" style="position:relative;width:160px;height:160px"><img src="android/mipmap-xxxhdpi/ic_launcher_background.png" width="160" height="160" style="position:absolute;inset:0"><img src="android/mipmap-xxxhdpi/ic_launcher_foreground.png" width="160" height="160" style="position:absolute;inset:0"></div><span class="cap">圆形</span></div>
        <div class="item"><div class="android" style="position:relative;width:96px;height:96px;border-radius:26px"><img src="android/mipmap-xxxhdpi/ic_launcher_background.png" width="96" height="96" style="position:absolute;inset:0"><img src="android/mipmap-xxxhdpi/ic_launcher_foreground.png" width="96" height="96" style="position:absolute;inset:0"></div><span class="cap">圆角方</span></div>
        <div class="item"><img class="ios" style="border-radius:11px" src="android/mipmap-xhdpi/ic_launcher.png" width="48" height="48"><span class="cap">传统 48</span></div>
      </div>
    </div>
  </section>

  <section>
    <p class="label">暗色背景检查</p>
    <div class="stage dark">
      <div class="row">
        <div class="item"><div class="ios" style="border-radius:40px"><img src="ios/AppIcon.appiconset/icon-1024.png" width="180" height="180"></div><span class="cap">iOS 180</span></div>
        <div class="item"><div class="android" style="position:relative;width:160px;height:160px"><img src="android/mipmap-xxxhdpi/ic_launcher_background.png" width="160" height="160" style="position:absolute;inset:0"><img src="android/mipmap-xxxhdpi/ic_launcher_foreground.png" width="160" height="160" style="position:absolute;inset:0"></div><span class="cap">Android 圆</span></div>
        <div class="item"><div class="ios" style="border-radius:13px"><img src="ios/AppIcon.appiconset/icon-1024.png" width="58" height="58"></div><span class="cap">58</span></div>
      </div>
    </div>
  </section>
</div>
</body>
</html>
