<!DOCTYPE html>
<html lang="zh-CN" data-theme="purple" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayZ · 页面设计</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/spec.css">
<link rel="stylesheet" href="assets/pages.css">
</head>
<body>

<!-- ============ 顶部控制栏 ============ -->
<header class="topbar">
  <div class="brand">
    <div class="mark">Z</div>
    <div><b>DayZ</b> <span>页面设计</span></div>
  </div>

  <div class="seg-present" role="group" aria-label="呈现方式">
    <button data-present="proto" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="3"/><path d="M11 5.5h2"/></svg>
      原型
    </button>
    <button data-present="canvas" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      画布
    </button>
  </div>

  <div class="spacer"></div>
  <span class="hint">原型可点进点出 · 画布拖拽缩放浏览</span>

  <div class="switcher" role="group" aria-label="主题色">
    <button class="swatch-btn" data-set="purple" title="雾紫 Lavender"></button>
    <button class="swatch-btn" data-set="amber" title="暖黄 Honey"></button>
    <button class="swatch-btn" data-set="sage" title="雾绿 Sage"></button>
  </div>
  <button class="mode-toggle" id="modeToggle" title="切换明暗">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span class="lbl">浅色</span>
  </button>
</header>

<!-- ============ 工作台 ============ -->
<div class="workspace mode-proto" id="workspace">
  <!-- 画布（静态多状态）-->
  <aside class="canvas-rail" id="canvasRail"></aside>
  <div class="board" id="board"><div class="canvas-world" id="canvasWorld"></div></div>
  <!-- 原型（单机 iframe 路由）-->
  <div class="proto-host" id="protoHost">
    <div class="iphone"><div class="screen"><div class="proto-stack" id="protoStack"></div></div></div>
  </div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
