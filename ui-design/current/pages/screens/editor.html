<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayZ · 编辑</title>
<script>(function(){var p=new URLSearchParams(location.search),r=document.documentElement;r.setAttribute("data-theme",p.get("theme")||"purple");r.setAttribute("data-mode",p.get("mode")||"light");r.setAttribute("data-state",p.get("state")||"writing");})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/spec.css">
<link rel="stylesheet" href="../assets/screen.css">
</head>
<body>
<div class="pg has-dock">
  <div class="app-top">
    <button class="ico" data-nav-back aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="title" data-when="empty" style="font-size:15px;color:var(--ink-3);font-family:var(--font-sans);font-weight:500">新日记</div>
    <div class="title" data-when="writing rich" style="font-size:15px;color:var(--ink-3);font-family:var(--font-sans);font-weight:500">草稿已存</div>
    <div class="acts"><button class="btn btn-primary btn-sm" data-nav-back>完成</button></div>
  </div>
  <div class="app-scroll">
    <div style="padding:var(--sp-3) var(--sp-5) 0">
      <div class="r-kicker" style="color:var(--accent-ink);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;margin-bottom:var(--sp-3)">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9h17M8 3v3M16 3v3"/></svg>
        今天 · 5月29日 周五
      </div>

      <input class="compose-title" data-when="empty" placeholder="标题">
      <input class="compose-title" data-when="writing" value="雨后去了城南的旧书店">
      <input class="compose-title" data-when="rich" value="周末徒步 · 准备清单">

      <div class="compose-meta" style="border:none;background:none;padding:var(--sp-3) 0 var(--sp-4)">
        <button class="chip-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 10h.01M15 10h.01"/><path d="M8.5 14.5h7"/></svg>心情</button>
        <button class="chip-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4"/></svg>天气</button>
        <button class="chip-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>地点</button>
        <button class="chip-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12V6a2 2 0 0 1 2-2h6l8 8-8 8z"/><circle cx="9" cy="9" r="1.4"/></svg>标签</button>
      </div>

      <!-- 空白新建 -->
      <div class="compose-body" data-when="empty">
        <p style="margin:0"><span class="dim">写点什么吧……</span><span class="compose-caret"></span></p>
      </div>

      <!-- 书写中 -->
      <div class="compose-body" data-when="writing">
        <p style="margin:0 0 var(--sp-4)">梅雨季的间隙，石板路还湿着。老板说这套旧版的《东京梦华录》等了很久，今天总算有人问起。</p>
        <p style="margin:0"><span class="dim">在这里继续写下今天的故事</span><span class="compose-caret"></span></p>
      </div>

      <!-- 富格式（展示 AppFlowy 块类型）-->
      <div class="compose-body" data-when="rich">
        <p style="margin:0 0 var(--sp-4)">周六打算去<strong>西山</strong>走一圈，趁天气好。把要带的东西先列一下，免得到时候手忙脚乱。</p>
        <h2 class="cb-h">出发清单</h2>
        <div class="cb-todo done"><span class="bx"></span><span class="tx">登山鞋 · 防滑</span></div>
        <div class="cb-todo done"><span class="bx"></span><span class="tx">两升水 + 盐丸</span></div>
        <div class="cb-todo"><span class="bx"></span><span class="tx">充电宝、雨衣</span></div>
        <div class="cb-todo"><span class="bx"></span><span class="tx">给相机换张空卡</span></div>
        <blockquote class="cb-quote">山不会走来找你，但它一直在那儿。</blockquote>
        <p style="margin:0"><span class="dim">继续写……</span><span class="compose-caret"></span></p>
      </div>
    </div>
  </div>

  <!-- 底部停靠工具栏：AppFlowy Editor 能力（横向滚动）-->
  <div class="toolbar editor-dock">
    <button class="tb" data-toggle aria-label="标题">H</button>
    <span class="div"></span>
    <button class="tb" data-toggle aria-label="加粗" style="font-weight:700">B</button>
    <button class="tb" data-toggle aria-label="斜体" style="font-style:italic">I</button>
    <button class="tb" data-toggle aria-label="下划线" style="text-decoration:underline">U</button>
    <button class="tb" data-toggle aria-label="删除线" style="text-decoration:line-through">S</button>
    <button class="tb" data-toggle aria-label="行内代码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-4 4 4 4M16 8l4 4-4 4"/></svg></button>
    <button class="tb" data-toggle aria-label="文字颜色 / 高亮"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="m14.5 4.5 5 5-8 8-5 .9.9-5z"/></svg></button>
    <span class="div"></span>
    <button class="tb" data-toggle aria-label="无序列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg></button>
    <button class="tb" data-toggle aria-label="有序列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h10M10 12h10M10 18h10M4 5h1.4v3.4M4 13.2c.3-.6 1.6-.6 1.6.3 0 .7-1.6 1.3-1.6 2.5h1.8"/></svg></button>
    <button class="tb" data-toggle aria-label="待办清单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.2" width="7" height="7" rx="2"/><path d="m4.8 7.6 1.3 1.3 2.3-2.6M14 7.5h6M3.5 15.2h7M14 16.5h6"/></svg></button>
    <button class="tb" data-toggle aria-label="引用"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7H5a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h2v1a3 3 0 0 1-3 3M20 7h-4a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h2v1a3 3 0 0 1-3 3"/></svg></button>
    <span class="div"></span>
    <button class="tb" aria-label="链接"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 14.5 14.5 9.5"/><path d="M11 6.5 12.5 5a4 4 0 0 1 5.6 5.6l-1.5 1.5M13 17.5 11.5 19a4 4 0 0 1-5.6-5.6l1.5-1.5"/></svg></button>
    <button class="tb" aria-label="分隔线"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h5M15 12h5"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg></button>
    <button class="tb" aria-label="插入图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="m4 17 4.5-4 3 2.5L16 11l4 4.5"/></svg></button>
  </div>
</div>
<script src="../assets/screen.js"></script>
</body>
</html>
