<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayZ · 设置</title>
<script>(function(){var p=new URLSearchParams(location.search),r=document.documentElement;r.setAttribute("data-theme",p.get("theme")||"purple");r.setAttribute("data-mode",p.get("mode")||"light");r.setAttribute("data-state",p.get("state")||"default");})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/spec.css">
<link rel="stylesheet" href="../assets/screen.css">
</head>
<body>
<div class="pg">
  <div class="app-top">
    <button class="ico" data-nav-back aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <div class="title">设置</div>
    <div class="acts"></div>
  </div>
  <div class="app-scroll">
    <div class="settings">
      <div class="set-account">
        <div class="avatar">林</div>
        <div class="who"><b>林晚</b><span>218 篇 · 本地库 41.2 MB</span></div>
      </div>
      <div class="set-group">
        <div class="lab">隐私与加密</div>
        <div class="set-list">
          <div class="set-row">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10" width="15" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
            <span class="tx"><b>App 锁</b><span>Face ID / 密码解锁</span></span>
            <label class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"></span></label>
          </div>
          <div class="set-row">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 4.4 3 7.6 7 9 4-1.4 7-4.6 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg></span>
            <span class="tx"><b>数据库加密</b><span>SQLCipher · 始终开启</span></span>
            <span class="val">已加密</span>
          </div>
        </div>
      </div>
      <div class="set-group">
        <div class="lab">备份与导出</div>
        <div class="set-list">
          <div class="set-row">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17a4 4 0 0 1-.6-7.95A5 5 0 0 1 16 8.5a3.5 3.5 0 0 1 .5 6.96"/><path d="M12 12v6m0-6-2.2 2.2M12 12l2.2 2.2"/></svg></span>
            <span class="tx"><b>本地备份</b><span>上次 · 今天 08:30</span></span>
            <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
          </div>
          <div class="set-row">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0-12 4 4m-4-4-4 4M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg></span>
            <span class="tx"><b>导出</b><span>PDF · Markdown · JSON</span></span>
            <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span>
          </div>
        </div>
      </div>
      <div class="set-group">
        <div class="lab">外观</div>
        <div class="set-list">
          <div class="set-row">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a4 4 0 0 0 0 8 3 3 0 0 1 0 6"/><circle cx="8.5" cy="8.5" r="1"/><circle cx="15.5" cy="8.5" r="1"/></svg></span>
            <span class="tx"><b>主题色</b><span>雾紫 / 暖黄 / 雾绿</span></span>
            <span class="val"><span class="dw-dot" style="background:var(--accent);width:13px;height:13px"></span>雾紫</span>
          </div>
          <div class="set-row">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"/></svg></span>
            <span class="tx"><b>外观模式</b><span>跟随系统</span></span>
            <span class="val">浅色<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span></span>
          </div>
        </div>
      </div>
      <div class="set-group">
        <div class="lab">书写</div>
        <div class="set-list">
          <div class="set-row">
            <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M13 3v6h6"/></svg></span>
            <span class="tx"><b>恢复未完成的编辑</b><span>启动时提示残留草稿</span></span>
            <label class="switch"><input type="checkbox" checked><span class="track"></span><span class="thumb"></span></label>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../assets/screen.js"></script>
</body>
</html>
